version: "2"
sql:
  - engine: sqlite
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: .
        overrides:
          # ids, counts and levels are the protocol's uint32. Unix times kept
          # as int64 are declared BIGINT and flags BOOLEAN, which sqlc maps
          # to int64 and bool itself.
          - db_type: INTEGER
            go_type: uint32
          - column: commander_activities.data1_list
            go_type:
              type: IDList
          - column: chapter_states.ambushed
            go_type:
              type: Cells
          - column: mails.attachments
            go_type:
              type: Drops
          - column: meowfficers.talents
            go_type:
              type: IDList
          - column: meowfficers.talent_origins
            go_type:
              type: IDList
          - column: meowfficers.talent_choices
            go_type:
              type: IDList
          - column: commander_exercise.vanguard
            go_type:
              type: IDList
          - column: commander_exercise.main
            go_type:
              type: IDList
          - column: commander_exercise.rivals
            go_type:
              type: IDList
