version: "2"
sql:
  - engine: sqlite
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: .
        overrides:
          # ids, counts and levels are the protocol's uint32. Unix times kept
          # as int64 are declared BIGINT and flags BOOLEAN, which sqlc maps
          # to int64 and bool itself.
          - db_type: INTEGER
            go_type: uint32
          - column: commander_activities.data1_list
            go_type:
              type: IDList
          - column: commander_minigame_data.datas
            go_type:
              type: IDList
          - column: chapter_states.ambushed
            go_type:
              type: Cells
          - column: mails.attachments
            go_type:
              type: Drops
          - column: compensations.attachments
            go_type:
              type: Drops
          - column: commander_coloring_awards.drops
            go_type:
              type: Drops
          - column: commander_play_room_views.dress_list
            go_type:
              type: IDList
          - column: meowfficers.talents
            go_type:
              type: IDList
          - column: meowfficers.talent_origins
            go_type:
              type: IDList
          - column: meowfficers.talent_choices
            go_type:
              type: IDList
          - column: commander_exercise.vanguard
            go_type:
              type: IDList
          - column: commander_exercise.main
            go_type:
              type: IDList
          - column: commander_exercise.rivals
            go_type:
              type: IDList
          - column: guild_users.donate_tasks
            go_type:
              type: IDList
          - column: guild_capital_logs.event_target
            go_type:
              type: IDList
          - column: commander_appearance.gallery_pics
            go_type:
              type: IDList
          - column: commander_appearance.manga_pics
            go_type:
              type: IDList
          - column: commander_secondary_passwords.system_list
            go_type:
              type: IDList
          - column: commander_auction.item_list
            go_type:
              type: IDList
          - column: apartment_ships.triggers
            go_type:
              type: IDList
          - column: apartment_ships.dialogues
            go_type:
              type: IDList
          - column: apartment_ships.skins
            go_type:
              type: IDList
          - column: apartment_hidden_parts.parts
            go_type:
